# Global advisory/AUM fee modeled into project -- a single rate applied to
# the whole portfolio's total value each year, paid Taxable -> Traditional
# -> Roth like any other cash need. pct_of_portfolio is a percentage, e.g.
# 1.0 means 1.00%/year.
advisory_expense:
  pct_of_portfolio: 0.75
